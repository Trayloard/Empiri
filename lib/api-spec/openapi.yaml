openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: companion
    description: Companion chat operations
  - name: voice
    description: Voice transcription and speech operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /conversations:
    post:
      operationId: createConversation
      tags: [companion]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [companion]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: sendMessage
      tags: [companion]
      summary: Send a text message and receive the companion's reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: The persisted user message and the companion's reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The companion failed to generate a reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /voice/transcribe:
    post:
      operationId: transcribeAudio
      tags: [voice]
      summary: Transcribe recorded audio into text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeInput"
      responses:
        "200":
          description: Transcribed text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResult"
        "422":
          description: No speech could be detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Transcription failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /voice/speech:
    post:
      operationId: synthesizeSpeech
      tags: [voice]
      summary: Convert text into spoken audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechInput"
      responses:
        "200":
          description: Base64-encoded spoken audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechResult"
        "502":
          description: Speech synthesis failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Conversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    ConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    MessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
        - content
    SendMessageResult:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        assistantMessage:
          $ref: "#/components/schemas/Message"
      required:
        - userMessage
        - assistantMessage
    TranscribeInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data
        format:
          type: string
          description: Source audio container/extension hint (e.g. m4a, wav, webm)
      required:
        - audio
    TranscribeResult:
      type: object
      properties:
        text:
          type: string
      required:
        - text
    SpeechInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
        - text
    SpeechResult:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded MP3 audio
        format:
          type: string
      required:
        - audio
        - format
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
